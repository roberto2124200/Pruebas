# Nombre de la Action
name: Terraform Deployment

# Eventos que disparan el pipeline
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      accion:
        description: "Acción Terraform a ejecutar"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform AWS
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      TF_INPUT: false

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan automatico en push
        if: github.event_name == 'push'
        run: terraform plan

      - name: Terraform Plan manual
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'plan'
        run: terraform plan

      - name: Terraform Apply manual
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform Destroy manual
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'destroy'
        run: terraform destroy -auto-approve